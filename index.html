<style>
:root{--bg:#f4faf2;--card:#ffffff;--ink:#173224;--mute:#5a6e61;--line:#d6e5d4;--green:#1a7f45;--on:#ffffff;--pin:#ffc83d;--bad:#d9482b;--band:#1a7f45;--bandink:#ffffff;--sun:#a85400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Public Sans",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 80px}
.mast{background:linear-gradient(180deg,#d6efff 0%,#f1f9ff 55%,#ffffff 100%);color:var(--ink);border-bottom:4px solid var(--green)}
.mast .in{max-width:640px;margin:0 auto;padding:18px 16px 4px;display:flex;align-items:center;gap:14px}
.mast .in>svg{flex:none;width:72px;height:72px;filter:drop-shadow(0 2px 3px rgba(23,50,36,.18))}
.mast h1{color:#145a32;font-size:36px;line-height:.95;margin:0;letter-spacing:.02em}
.mast .tag{margin:6px 0 0;color:var(--sun);font:600 12px "Public Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase}
.mast nav{max-width:640px;margin:0 auto;padding:0 16px;border:0}
.mast nav button{color:var(--mute);border-bottom:4px solid transparent;margin-bottom:-4px;padding:12px 4px}
.mast nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--pin)}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.01em}
h1{font-size:34px;margin:8px 0 2px}h2{font-size:24px;margin:20px 0 8px}
.sub{color:var(--mute);margin:0 0 12px}
nav{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:8px 0 16px}
nav button{flex:1;background:none;border:0;padding:10px 4px;font:600 15px "Public Sans",sans-serif;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--pin)}
button,input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:4px 0 10px}
.btn{background:var(--green);color:var(--on);border:0;border-radius:8px;padding:12px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--card);cursor:pointer}
.chip[aria-pressed=true]{background:var(--green);color:var(--on);border-color:var(--green)}
.course{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.course small{color:var(--mute)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--mute);vertical-align:-1px;margin-right:6px}
.hole{display:flex;align-items:baseline;gap:14px}
.hole .num{font-size:72px;line-height:1}
.facts{display:flex;gap:16px;color:var(--mute)}.facts b{color:var(--ink)}
.strip{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.strip button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.strip button.done{background:var(--green);color:var(--on);border-color:var(--green)}
.strip button[aria-current=true]{outline:3px solid var(--pin)}
.pl{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.pl .num{font-size:44px;min-width:56px;text-align:center}
.step{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:26px;cursor:pointer}
.tot{color:var(--mute)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600}
.r{text-align:right}.over{color:var(--bad)}
.hcp{font-size:44px}
.empty{color:var(--mute);padding:8px 0}
svg{width:100%;height:auto;display:block}
.note{background:var(--bg);border-left:4px solid var(--pin);padding:8px 10px;border-radius:4px}label{display:block;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px 0}
.seg button{flex:1;padding:9px 6px;border:0;background:var(--card);font-weight:600;cursor:pointer}
.seg button[aria-selected=true]{background:var(--green);color:var(--on)}
.cardwrap{overflow-x:auto;margin:8px 0}
table.sc{table-layout:fixed;font-size:14px;font-variant-numeric:tabular-nums}
table.sc th,table.sc td{padding:3px 0;text-align:center;border-top:1px solid var(--line)}
table.sc th:first-child{text-align:left;width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
table.sc thead th{background:var(--band);color:var(--bandink);font-size:12px;font-weight:600;border-top:0}
table.sc thead th:first-child{color:var(--bandink);padding-left:6px}
.box{border-top:3px solid var(--green)}
table.sc tr.par td{color:var(--mute)}
table.sc td.t{font-weight:700;width:30px}
.cell{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1.5px solid transparent;background:none;padding:0;font:inherit;color:inherit}
button.cell{cursor:pointer;border-radius:4px}
button.cell:empty::after{content:"·";color:var(--mute)}
.cell.b,.cell.e{border-color:var(--green);border-radius:50%}
.cell.e{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--green)}
.cell.o,.cell.d{border-color:var(--bad);border-radius:2px}
.cell.d{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px}
.legend .cell{width:20px;height:20px;font-size:12px}
.tots td{padding:6px 4px}.tots .big{font-size:24px}
.addp{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.addp summary{cursor:pointer;font-weight:600}
.btn.danger{background:var(--bad);color:var(--on)}
.toast{background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:8px;margin:0 0 12px}

/* ---- modern refresh ---- */
:root{--bg:#f3f5f2;--card:#ffffff;--fill:rgba(118,128,118,.12);--fill2:rgba(118,128,118,.2);--line:rgba(60,70,60,.12);--green:#178a48;--green2:#20b25c;--ink:#14231a;--mute:#6b7a70;--shadow:0 1px 2px rgba(20,35,26,.05),0 8px 28px rgba(20,35,26,.07)}
body{background:var(--bg);-webkit-font-smoothing:antialiased}
.mast{background:none;border:0;position:relative;overflow:hidden}

.navbar{position:sticky;top:0;z-index:5;background:rgba(243,245,242,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid transparent;transition:border-color .2s}
.navbar.stuck{border-bottom-color:var(--line)}
.navbar nav{max-width:640px;margin:0 auto;padding:8px 16px;border:0;background:none}

#nav{position:relative}

#nav{background:var(--fill);border-radius:12px;padding:3px;gap:2px;max-width:608px;margin:8px auto}
.navbar{padding:0 16px}
#nav button[aria-selected=true]{background:#fff;box-shadow:0 1px 3px rgba(20,35,26,.12),0 3px 8px rgba(20,35,26,.06)}
main{padding-top:8px}
.box{border:0;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.box>b:first-child,.box>label:first-child b{font-size:17px;letter-spacing:-.01em}

input,select{border:0;background:var(--fill);border-radius:12px;padding:12px 14px;transition:box-shadow .15s,background .15s}

.btn{border-radius:999px;padding:12px 20px;background:linear-gradient(180deg,var(--green2),var(--green));box-shadow:0 4px 14px rgba(23,138,72,.28);transition:transform .12s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.05)}
.btn:active,.chip:active,.step:active,.cell:active{transform:scale(.96)}
.btn.alt{background:var(--fill);border:0;box-shadow:none;color:var(--ink)}

.chip{border:0;background:var(--fill);padding:8px 14px;font-weight:600;font-size:14.5px;transition:background .15s,transform .12s}

span.chip{cursor:default}
.course{border:0;border-radius:0;background:none;padding:13px 28px 13px 2px;margin:0;border-bottom:1px solid var(--line);position:relative;font-weight:600}
.course:last-of-type{border-bottom:0}

.course:hover{background:rgba(23,138,72,.04)}
.pl{border-top:1px solid var(--line);padding:12px 0}

.strip{gap:6px}
.strip button{border:0;background:var(--fill);border-radius:10px;font-size:14px;transition:background .15s}
.strip button.done{background:rgba(23,138,72,.16);color:var(--green)}
.strip button[aria-current=true]{outline:0;background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(23,138,72,.35)}
.hole .num{font-size:84px;background:linear-gradient(180deg,var(--ink),#3c5a48);-webkit-background-clip:text;background-clip:text;color:transparent}

.seg{border:0;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{background:none;border-radius:9px;color:var(--ink);transition:background .2s,box-shadow .2s}
.seg button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,35,26,.12),0 3px 8px rgba(20,35,26,.06)}
table.sc{border-radius:14px;overflow:hidden}
table.sc thead th{background:var(--fill);color:var(--mute)}
table.sc thead th:first-child{color:var(--mute)}
table.sc th,table.sc td{border-top:1px solid var(--line)}
table.sc thead th{border-top:0}
.cardwrap{background:#fff;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.note{background:linear-gradient(135deg,rgba(255,200,61,.18),rgba(255,200,61,.08));border:0;border-radius:16px;padding:12px 14px}
.box.note{box-shadow:none}

.hcp{font-size:42px;color:var(--green)}

.legend{color:var(--mute)}
.hole{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 16px}

.pk{border:0;background:var(--fill);border-radius:12px;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;transition:background .12s,transform .1s}

/* ---- home + simple nav ---- */
.mast{display:none}
.mast.home{display:block}
.navbar[hidden]{display:none}
#nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:none;border-radius:0;padding:6px 0;margin:0 auto;max-width:608px;gap:8px}
#nav .back{justify-self:start;display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:8px 10px 8px 2px;font:600 16px "Public Sans",sans-serif;color:var(--green);cursor:pointer;border-radius:10px;box-shadow:none;flex:none}

.navbar{border-bottom:1px solid var(--line)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;border:0;border-radius:24px;padding:20px 18px 18px;min-height:178px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s,box-shadow .2s}

 {const m=await u.me();if(m.email)db.doc('emails/'+me).get().then(x=>{const d=x.exists?x.data():null;if(!d||d.email!==m.email||d.pw!==!!m.pw)db.doc('emails/'+me).set({email:m.email,pw:!!m.pw}).catch(()=>{})}).catch(()=>{})}

function stats(uid,sc=lbScope){

 let played=0,birdies=0,pars=0,holes=0,best=null,full=[];
 rs.forEach(r=>{const sc=r.sc[uid];if(!sc.some(v=>v!=null))return;played++;
  sc.forEach((v,j)=>{if(v==null||!r.par[j])return;holes++;if(v<r.par[j])birdies++;if(v<=r.par[j])pars++});
  if(r.n===18&&sc.every(v=>v!=null)){const g=sum(sc);full.push(g);const tp=r.par.every(Boolean)?g-sum(r.par):null;if(!best||g<best.g)best={g,tp,cn:r.cn,date:r.date}}});
 return{played,birdies,parPct:holes?Math.round(pars/holes*100):null,best,avg:full.length?Math.round(sum(full)/full.length*10)/10:null}}

const MS=[['r1','rounds','First round','First saved round'],['r10','rounds','10 rounds','Rounds saved'],['r25','rounds','25 rounds','Rounds saved'],['r50','rounds','50 rounds','Rounds saved'],['r100','rounds','100 rounds','Rounds saved'],

 ['par','hole','First par','Par on a hole'],['bird','hole','First birdie','One under on a hole'],['eagle','hole','First eagle','Two under on a hole'],['ace','ace','Hole in one','The big one'],
 ['run3','run3','Hat trick','3 pars or better in a row'],['b10','bc','10 birdies','Birdie or better, all time'],['b50','bc','50 birdies','Birdie or better, all time'],
 ['u100','brk','Broke 100','Under 100 for 18'],['u90','brk','Broke 90','Under 90 for 18'],['u80','brk','Broke 80','Under 80 for 18'],['u70','brk','Broke 70','Under 70 for 18'],['even','brk','Even par','Par or better for 18'],

  at('r1',d);[10,25,50,100].forEach(n=>{if(i+1===n)at('r'+n,d)});
  crs.add(r.cn);if(crs.size>=5)at('c5',d);

  sc.forEach((v,j)=>{const p=r.par[j];if(v==null||!p){run=0;return}
   if(v===1)at('ace',d);if(v===p)at('par',d);
   if(v<p){at('bird',d);birdies++;if(birdies>=10)at('b10',d);if(birdies>=50)at('b50',d)}
   if(v<=p-2)at('eagle',d);
   if(v<=p){if(++run>=3)at('run3',d)}else run=0});
